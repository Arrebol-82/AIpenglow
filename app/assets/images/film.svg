<svg xmlns="http://www.w3.org/2000/svg"
     width="716"
     height="914"
     viewBox="0 0 716 914"
     preserveAspectRatio="none"
     role="img"
     aria-label="Simple two-frame vertical film strip with evenly spaced square sprocket holes">
